<text x="297" y="139.16" font-family="DejaVu Sans" font-weight="700" font-size="41" fill="#18344A">Wir baten unsere magnetischen Freunde, ein Portal zwischen unserer Welt und</text><text x="297" y="189.18" font-family="DejaVu Sans" font-weight="700" font-size="41" fill="#18344A">der Welt zu öffnen, aus der das Echo kam.</text></g>
