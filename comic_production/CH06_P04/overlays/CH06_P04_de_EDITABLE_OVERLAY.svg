<path d="M849 1708 h43" stroke="#F6A64B" stroke-width="6" stroke-linecap="round"/>
<text x="853" y="1743.15" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#FFFFFF">Mika öffnete die</text><text x="853" y="1779.45" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#FFFFFF">Augen. Nun</text><text x="853" y="1815.75" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#FFFFFF">wusste er,</text><text x="853" y="1852.05" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#FFFFFF">wohin.</text></g>
<g id="CH06_P04_L005_part_2" data-line-id="CH06_P04_L005" data-speaker="CHR_004" data-kind="narrator" data-display-part="2">
<rect x="1255" y="2012" width="850" height="125" rx="17" fill="#061021" opacity=".18"/>
<rect x="1250" y="2006" width="850" height="125" rx="17" fill="#132D4E" fill-opacity=".90" stroke="#55D3E1" stroke-width="4.5"/>
<path d="M1269 2022 h43" stroke="#F6A64B" stroke-width="6" stroke-linecap="round"/>
<text x="1273" y="2066.92" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#FFFFFF">Er verabschiedete sich von der Crew und flog mit</text><text x="1273" y="2100.8" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#FFFFFF">seinem neuen Freund zur Kreuzung der Welten.</text></g>
<g id="CH06_P04_L006_part_1" data-line-id="CH06_P04_L006" data-speaker="CHR_004" data-kind="narrator" data-display-part="1">
<rect x="96" y="2204" width="770" height="120" rx="17" fill="#061021" opacity=".18"/>
<rect x="91" y="2198" width="770" height="120" rx="17" fill="#132D4E" fill-opacity=".90" stroke="#55D3E1" stroke-width="4.5"/>
<path d="M110 2214 h43" stroke="#F6A64B" stroke-width="6" stroke-linecap="round"/>
<text x="114" y="2255.48" font-family="DejaVu Sans" font-weight="700" font-size="32" fill="#FFFFFF">An der Kreuzung der Welten meldete</text><text x="114" y="2294.2" font-family="DejaVu Sans" font-weight="700" font-size="32" fill="#FFFFFF">sich sein neuronaler Freund wieder.</text></g>
<g id="CH06_P04_L006_part_2" data-line-id="CH06_P04_L006" data-speaker="CHR_004" data-kind="narrator" data-display-part="2">
