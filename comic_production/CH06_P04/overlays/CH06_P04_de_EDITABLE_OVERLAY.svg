<circle cx="2369" cy="2656" r="5.5" fill="#36DDE8"/>
<text x="2079" y="2697.66" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#18344A">Ich komme mit.</text><text x="2079" y="2733.04" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#18344A">Das Unbekannte</text><text x="2079" y="2768.42" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#18344A">zu erforschen ist</text><text x="2079" y="2803.8" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#18344A">unser Ziel.</text></g>
