<text x="803" y="650.14" font-family="DejaVu Sans" font-weight="700" font-size="39" fill="#18344A">Habt ihr mich</text><text x="803" y="697.72" font-family="DejaVu Sans" font-weight="700" font-size="39" fill="#18344A">also gerettet?</text></g>
