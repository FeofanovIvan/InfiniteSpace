<text x="123" y="3049.24" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#FFFFFF">Vor ihm öffnete sich ein Durchgang. Mika</text><text x="123" y="3089.17" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#FFFFFF">steuerte sein Raumschiff hinein.</text></g>
