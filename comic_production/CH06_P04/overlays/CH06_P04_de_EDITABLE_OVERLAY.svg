<text x="663" y="2762.68" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#FFFFFF">Um das Artefakt zu nutzen,</text><text x="663" y="2797.78" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#FFFFFF">musste er ein Rätsel lösen.</text></g>
<g id="CH06_P04_L007_part_1" data-line-id="CH06_P04_L007" data-speaker="CHR_038" data-kind="neuron" data-display-part="1">
<path d="M1269 2688 Q1246 2688 1246 2711 V2808 Q1246 2831 1269 2831 H1356 L1334 2856 L1406 2831 H1703 Q1726 2831 1726 2808 V2711 Q1726 2688 1703 2688 Z" fill="#4ED0DB" fill-opacity=".96" stroke="#253456" stroke-width="5.2" stroke-linejoin="round"/>
<path d="M1273 2705 h52" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="1701" cy="2705" r="5.5" fill="#36DDE8"/>
<text x="1273" y="2756.78" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#18344A">Auch wir wissen nicht,</text><text x="1273" y="2790.94" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#18344A">wohin das Artefakt führt.</text></g>
<g id="CH06_P04_L007_part_2" data-line-id="CH06_P04_L007" data-speaker="CHR_038" data-kind="neuron" data-display-part="2">
<path d="M2075 2639 Q2052 2639 2052 2662 V2810 Q2052 2833 2075 2833 H2234 L2305 2858 L2283 2833 H2371 Q2394 2833 2394 2810 V2662 Q2394 2639 2371 2639 Z" fill="#4ED0DB" fill-opacity=".96" stroke="#253456" stroke-width="5.2" stroke-linejoin="round"/>
