<text x="2095.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" y="3352.22">NOUVEAU CAP :</text><text x="2095.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" y="3396.67">ANDROMÈDE</text></g>
