<g id="CH04_P05_L001" data-speaker="CHR_004" data-kind="narration">
<rect x="779" y="85" width="588" height="188" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="775" y="78" width="588" height="188" rx="27" fill="#FFF9F0" stroke="#9474C3" stroke-width="6" />
<rect x="809" y="95" width="75" height="8" rx="4" fill="#EEA04C" />
<text x="813.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" y="143.20">At last, our friends arrived at</text><text x="813.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" y="183.84">the archaeological museum</text><text x="813.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" y="224.48">on Runa.</text></g>
<g id="CH04_P05_L002" data-speaker="CHR_004" data-kind="narration">
<rect x="1462" y="95" width="564" height="147" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="1458" y="88" width="564" height="147" rx="27" fill="#FFF9F0" stroke="#9474C3" stroke-width="6" />
<rect x="1492" y="105" width="75" height="8" rx="4" fill="#EEA04C" />
<text x="1496.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" y="153.28">The professor decided to</text><text x="1496.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" y="192.66">join Mika for a look around.</text></g>
<g id="CH04_P05_L003" data-speaker="CHR_015" data-kind="speech">
<path d="M 2101 300 L 2135 362 L 2165 300" fill="#FFF0C6" stroke="#D69A38" stroke-width="5" stroke-linejoin="round" />
<rect x="2074" y="103" width="374" height="205" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="2070" y="96" width="374" height="205" rx="27" fill="#FFF0C6" stroke="#D69A38" stroke-width="6" />
<rect x="2104" y="113" width="75" height="8" rx="4" fill="#F3B657" />
<text x="2099.00" fill="#382643" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" y="175.10">Mika, look! A skull</text><text x="2099.00" fill="#382643" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" y="208.12">like that of a small</text><text x="2099.00" fill="#382643" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" y="241.14">predatory dinosaur!</text></g>
<g id="CH04_P05_L004" data-speaker="CHR_001" data-kind="speech">
<path d="M 1595 857 L 1745 785 L 1655 857" fill="#F1E8FF" stroke="#A87BD6" stroke-width="5" stroke-linejoin="round" />
<rect x="1464" y="863" width="220" height="96" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="1460" y="856" width="220" height="96" rx="27" fill="#F1E8FF" stroke="#A87BD6" stroke-width="6" />
<rect x="1494" y="873" width="75" height="8" rx="4" fill="#C390E7" />
<text x="1498.00" fill="#34234F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" y="913.99">Wow!</text></g>
<g id="CH04_P05_L005" data-speaker="CHR_004" data-kind="narration">
<rect x="82" y="1092" width="652" height="104" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="78" y="1085" width="652" height="104" rx="27" fill="#FFF9F0" stroke="#9474C3" stroke-width="6" />
<rect x="112" y="1102" width="75" height="8" rx="4" fill="#EEA04C" />
<text x="116.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" y="1149.58">When two professors meet…</text></g>
<g id="CH04_P05_L006" data-speaker="CHR_033" data-kind="speech">
<path d="M 530 1839 L 560 1730 L 590 1839" fill="#E5FAFA" stroke="#37B8C5" stroke-width="5" stroke-linejoin="round" />
<rect x="129" y="1845" width="805" height="140" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="125" y="1838" width="805" height="140" rx="27" fill="#E5FAFA" stroke="#37B8C5" stroke-width="6" />
<rect x="159" y="1855" width="75" height="8" rx="4" fill="#F3AD56" />
<text x="163.00" fill="#173A4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="700" y="1921.69">A pleasure to meet you, colleague!</text></g>
<g id="CH04_P05_L007" data-speaker="CHR_004" data-kind="narration">
<rect x="1456" y="1119" width="970" height="128" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="1452" y="1112" width="970" height="128" rx="27" fill="#FFF9F0" stroke="#9474C3" stroke-width="6" />
<rect x="1486" y="1129" width="75" height="8" rx="4" fill="#EEA04C" />
<text x="1490.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="700" y="1189.69">…a debate is never far behind!</text></g>
<g id="CH04_P05_L008" data-speaker="CHR_004" data-kind="narration">
<rect x="66" y="2077" width="2360" height="123" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="62" y="2070" width="2360" height="123" rx="27" fill="#F1ECFA" stroke="#A27BC7" stroke-width="6" />
<rect x="96" y="2087" width="75" height="8" rx="4" fill="#31C4D8" />
<text x="110.00" fill="#342549" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" y="2124.34">The scientists had a theory: the asteroid may not have ended that ancient evolutionary branch. Traces of life from Earth could have reached another</text><text x="110.00" fill="#342549" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" y="2158.63">galaxy, mingled with local species and given rise to an unusual hybrid—the ancestor of the lizards.</text></g>
<g id="CH04_P05_L009" data-speaker="CHR_004" data-kind="narration">
<rect x="79" y="2599" width="1275" height="96" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="75" y="2592" width="1275" height="96" rx="27" fill="#FFF9F0" stroke="#9474C3" stroke-width="6" />
<rect x="109" y="2609" width="75" height="8" rx="4" fill="#EEA04C" />
<text x="113.00" fill="#33284D" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" y="2653.32">For once, the scientists actually reached an agreement!</text></g>
<g id="CH04_P05_L010" data-speaker="CHR_033" data-kind="speech">
<rect x="1974" y="2517" width="475" height="264" rx="22" fill="#1C1738" opacity="0.19" />
<rect x="1970" y="2510" width="475" height="264" rx="22" fill="#123458" stroke="#24BEDD" stroke-width="6" />
<rect x="2003" y="2527" width="75" height="8" rx="4" fill="#F2A64D" />
<text x="2000.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" y="2576.90">Our excavations</text><text x="2000.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" y="2615.00">uncovered traces of an</text><text x="2000.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" y="2653.10">ancient people. It seems</text><text x="2000.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" y="2691.20">they could control</text><text x="2000.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" y="2729.30">gravity!</text></g>
<g id="CH04_P05_L011" data-speaker="CHR_033" data-kind="speech">
<rect x="1418" y="3175" width="400" height="247" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="1414" y="3168" width="400" height="247" rx="27" fill="#123458" stroke="#24BEDD" stroke-width="6" />
<rect x="1448" y="3185" width="75" height="8" rx="4" fill="#F2A64D" />
<text x="1443.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" y="3228.57">Perhaps their</text><text x="1443.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" y="3265.40">knowledge will help</text><text x="1443.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" y="3302.23">you solve the</text><text x="1443.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" y="3339.06">mystery of the</text><text x="1443.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" y="3375.89">storm, Mika.</text></g>
<g id="CH04_P05_L012" data-speaker="CHR_008" data-kind="system">
<rect x="2074" y="3292" width="379" height="153" rx="27" fill="#1C1738" opacity="0.19" />
<rect x="2070" y="3285" width="379" height="153" rx="27" fill="#10305C" stroke="#3DE6F4" stroke-width="6" />
<rect x="2104" y="3302" width="75" height="8" rx="4" fill="#F8B857" />
<text x="2095.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" y="3352.22">NEW COURSE:</text><text x="2095.00" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" y="3396.67">ANDROMEDA</text></g>
