<text x="153.0" y="1320.60" font-family="Noto Sans" font-stretch="semi-condensed" font-size="33" font-weight="700" fill="#30234F">What do we do</text>
<text x="153.0" y="1360.86" font-family="Noto Sans" font-stretch="semi-condensed" font-size="33" font-weight="700" fill="#30234F">now?</text>
