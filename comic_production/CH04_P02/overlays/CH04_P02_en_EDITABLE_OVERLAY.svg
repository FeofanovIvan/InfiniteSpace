<rect x="170" y="18" width="20" height="6" rx="3" fill="#43CAE1"/>
<text x="111.0" y="57.36" font-family="Noto Sans" font-stretch="semi-condensed" font-size="29" font-weight="700" fill="#2C2948">Tall, lizard-like strangers burst onto the ship. Firm but surprisingly polite, they ushered everyone into a cage.</text>
</g>
