<text x="2020.0" y="1036.70" font-family="Noto Sans" font-stretch="semi-condensed" font-size="31" font-weight="700" fill="#4A302A">Well, is your room</text>
<text x="2020.0" y="1074.52" font-family="Noto Sans" font-stretch="semi-condensed" font-size="31" font-weight="700" fill="#4A302A">comfortable?</text>
