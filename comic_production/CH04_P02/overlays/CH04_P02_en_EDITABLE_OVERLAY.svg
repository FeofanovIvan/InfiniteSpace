<path d="M 1048 353 Q 1072 307 1123 337 Q 1167 305 1203 336 Q 1255 321 1279 360 Q 1348 371 1326 422 Q 1351 470 1296 493 Q 1265 526 1228 499 Q 1184 531 1138 500 Q 1073 522 1053 487 Q 1009 460 1026 434 Q 1008 380 1048 353 Z" fill="#EEE1FF" stroke="#9D75C6" stroke-width="5"/>
