<ellipse cx="1332" cy="1733" rx="14" ry="5" fill="#A6EEF5"/>
<text x="1322.0" y="1776.73" font-family="Noto Sans" font-stretch="semi-condensed" font-size="33" font-weight="700" fill="#205769">Шу-у… Буль…</text>
</g>
<g id="CH04_P02_L015" data-speaker="Мика (переводит)" data-kind="trans">
<rect x="87" y="2287" width="1628" height="194" rx="19" fill="#13102A" opacity="0.12"/>
<rect x="84" y="2282" width="1628" height="194" rx="19" fill="#122C51" stroke="#45D7E8" stroke-width="5"/>
<rect x="100" y="2295" width="59" height="6" rx="3" fill="#F2AB56"/>
<rect x="168" y="2295" width="20" height="6" rx="3" fill="#2B6683"/>
<text x="109" y="2320" font-family="Noto Sans" font-stretch="semi-condensed" font-size="23" font-weight="700" letter-spacing="1.2" fill="#F2AB56">MIKA · RELAYING HIS FRIEND'S WORDS</text>
<text x="118.0" y="2380.05" font-family="Noto Sans" font-stretch="semi-condensed" font-size="33" font-weight="700" fill="#FFFFFF">Our friend says Sargon is being held prisoner. Help us escape, and he'll try to arrange Sargon's</text>
<text x="118.0" y="2420.31" font-family="Noto Sans" font-stretch="semi-condensed" font-size="33" font-weight="700" fill="#FFFFFF">release.</text>
</g>
<g id="CH04_P02_L014" data-speaker="Ящер-пират" data-kind="speech">
<path d="M 2111,2306 Q 2120,2253 2156,2241 Q 2159,2255 2150,2308 Z" fill="#FFECE0" stroke="#C97946" stroke-width="5" stroke-linejoin="round"/>
<rect x="1743" y="2302" width="653" height="179" rx="31" fill="#121127" opacity="0.13"/>
<rect x="1740" y="2297" width="653" height="179" rx="31" fill="#FFECE0" stroke="#C97946" stroke-width="5"/>
<path d="M 1771 2313 h 60" fill="none" stroke="#F18F45" stroke-width="7" stroke-linecap="round"/>
<text x="1774.0" y="2376.30" font-family="Noto Sans" font-stretch="semi-condensed" font-size="34" font-weight="700" fill="#4A302A">Agreed! But first, I need a bite to</text>
<text x="1774.0" y="2417.78" font-family="Noto Sans" font-stretch="semi-condensed" font-size="34" font-weight="700" fill="#4A302A">eat!</text>
</g>
<g id="CH04_P02_L016" data-speaker="Автор" data-kind="caption">
<rect x="90" y="3315" width="2290" height="177" rx="19" fill="#13102A" opacity="0.12"/>
<rect x="87" y="3310" width="2290" height="177" rx="19" fill="#FFF9F0" stroke="#6973AB" stroke-width="5"/>
<rect x="104" y="3325" width="59" height="6" rx="3" fill="#F4A54F"/>
<rect x="172" y="3325" width="20" height="6" rx="3" fill="#43CAE1"/>
<text x="1232.0" y="3384.40" font-family="Noto Sans" font-size="47" font-weight="700" fill="#2C2948" text-anchor="middle">After a quick bite, the lizard helped our friends escape. Soon the whole group reached their</text><text x="1232.0" y="3441.74" font-family="Noto Sans" font-size="47" font-weight="700" fill="#2C2948" text-anchor="middle">starship.</text></g>
