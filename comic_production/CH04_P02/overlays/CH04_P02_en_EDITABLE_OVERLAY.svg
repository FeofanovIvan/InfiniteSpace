<path d="M 126 1733 h 60" fill="none" stroke="#F18F45" stroke-width="7" stroke-linecap="round"/>
<text x="120.0" y="1783.70" font-family="Noto Sans" font-stretch="semi-condensed" font-size="36" font-weight="700" fill="#4A302A">Sargon?! What</text>
<text x="120.0" y="1827.62" font-family="Noto Sans" font-stretch="semi-condensed" font-size="36" font-weight="700" fill="#4A302A">happened to him?</text>
</g>
<g id="CH04_P02_L012_b" data-speaker="Ящер-пират" data-kind="speech">
<path d="M 437,2109 Q 484,2087 538,2068 Q 523,2089 476,2111 Z" fill="#FFECE0" stroke="#C97946" stroke-width="5" stroke-linejoin="round"/>
