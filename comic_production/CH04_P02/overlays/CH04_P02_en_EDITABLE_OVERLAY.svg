<text x="117.0" y="205.30" font-family="Noto Sans" font-stretch="semi-condensed" font-size="29" font-weight="700" fill="#42334B">What will happen to</text>
<text x="117.0" y="240.68" font-family="Noto Sans" font-stretch="semi-condensed" font-size="29" font-weight="700" fill="#42334B">us?!</text>
</g>
