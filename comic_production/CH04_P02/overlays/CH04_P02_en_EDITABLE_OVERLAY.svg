<rect x="94" y="2070" width="372" height="213" rx="31" fill="#FFECE0" stroke="#C97946" stroke-width="5"/>
<path d="M 125 2086 h 60" fill="none" stroke="#F18F45" stroke-width="7" stroke-linecap="round"/>
<text x="119.0" y="2166.30" font-family="Noto Sans" font-stretch="semi-condensed" font-size="34" font-weight="700" fill="#4A302A">He said he had a</text>
<text x="119.0" y="2207.78" font-family="Noto Sans" font-stretch="semi-condensed" font-size="34" font-weight="700" fill="#4A302A">plan to get rich!</text>
</g>
