<text x="1045.0" y="404.70" font-family="Noto Sans" font-stretch="semi-condensed" font-size="36" font-weight="700" fill="#36264F">I'll never get</text>
<text x="1045.0" y="448.62" font-family="Noto Sans" font-stretch="semi-condensed" font-size="36" font-weight="700" fill="#36264F">home…</text>
