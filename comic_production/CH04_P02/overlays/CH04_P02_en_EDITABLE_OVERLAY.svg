<rect x="1301" y="1431" width="512" height="178" rx="31" fill="#F2EBFF" stroke="#9670C7" stroke-width="5"/>
<path d="M 1332 1447 h 60" fill="none" stroke="#BB9AFF" stroke-width="7" stroke-linecap="round"/>
<text x="1335.0" y="1490.88" font-family="Noto Sans" font-stretch="semi-condensed" font-size="32" font-weight="700" fill="#30234F">You're just like that one</text>
<text x="1335.0" y="1529.92" font-family="Noto Sans" font-stretch="semi-condensed" font-size="32" font-weight="700" fill="#30234F">from the Small Magellanic</text>
<text x="1335.0" y="1568.96" font-family="Noto Sans" font-stretch="semi-condensed" font-size="32" font-weight="700" fill="#30234F">Cloud!</text>
