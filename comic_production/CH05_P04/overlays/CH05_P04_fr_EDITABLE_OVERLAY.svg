<text x="131" y="726" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">ARCHIVES</text>
<text x="133.00" y="784.1" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="35" font-weight="700"><tspan x="133.00" dy="0">Nous avons découvert d’immenses tunnels</tspan><tspan x="133.00" dy="43">gravitationnels et appris à les relier entre eux.</tspan></text></g>
<g id="CH05_P04_L002" data-speaker="CHR_037" data-frame="2" data-kind="archive">
<path d="M131,1463 H1191 L1216,1488 V1657 L1191,1682 H131 L106,1657 V1488 Z" fill="#020714" opacity=".35" />
<path d="M125,1454 H1185 L1210,1479 V1648 L1185,1673 H125 L100,1648 V1479 Z" fill="#102344" fill-opacity=".96" stroke="#3BC7E6" stroke-width="5" />
<path d="M126,1475 H203" stroke="#FFA74B" stroke-width="9" stroke-linecap="round" />
<path d="M1100,1653 H1178" stroke="#FFA74B" stroke-width="7" stroke-linecap="round" />
<text x="137" y="1502" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">ARCHIVES</text>
<text x="139.00" y="1546.6" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="34" font-weight="700"><tspan x="139.00" dy="0">Il y a très longtemps, quand nous sommes arrivés</tspan><tspan x="139.00" dy="41">dans ce monde, ses habitants nous ont aidés à nous</tspan><tspan x="139.00" dy="41">adapter. Nous sommes toujours en contact avec eux.</tspan></text></g>
