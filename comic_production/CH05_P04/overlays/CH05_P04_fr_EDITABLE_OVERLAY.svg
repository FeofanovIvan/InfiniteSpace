<text x="1678.00" y="2791.2" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="34" font-weight="700"><tspan x="1678.00" dy="0">Notre ami magnétique a rejoint</tspan><tspan x="1678.00" dy="41">l’équipage et guidé le vaisseau</tspan><tspan x="1678.00" dy="41">vers une région de l’espace</tspan><tspan x="1678.00" dy="41">inconnue de Mika, à la rencontre</tspan><tspan x="1678.00" dy="41">de ses sauveurs.</tspan></text></g>
