<path d="M1401,1441 H2346 L2371,1466 V1646 L2346,1671 H1401 L1376,1646 V1466 Z" fill="#020714" opacity=".35" />
<path d="M1395,1432 H2340 L2365,1457 V1637 L2340,1662 H1395 L1370,1637 V1457 Z" fill="#102344" fill-opacity=".96" stroke="#3BC7E6" stroke-width="5" />
<path d="M1396,1453 H1473" stroke="#FFA74B" stroke-width="9" stroke-linecap="round" />
<path d="M2255,1642 H2333" stroke="#FFA74B" stroke-width="7" stroke-linecap="round" />
<text x="1407" y="1480" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">ARCHIVES</text>
<text x="1409.00" y="1528.0" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="37" font-weight="700"><tspan x="1409.00" dy="0">Récemment, ils nous ont envoyé un signal</tspan><tspan x="1409.00" dy="45">pour nous demander d’ouvrir un tunnel</tspan><tspan x="1409.00" dy="45">entre ton monde et le nôtre.</tspan></text></g>
<g id="CH05_P04_L004" data-speaker="CHR_037" data-frame="4" data-kind="archive">
<path d="M136,2409 H1256 L1281,2434 V2570 L1256,2595 H136 L111,2570 V2434 Z" fill="#020714" opacity=".35" />
<path d="M130,2400 H1250 L1275,2425 V2561 L1250,2586 H130 L105,2561 V2425 Z" fill="#102344" fill-opacity=".96" stroke="#3BC7E6" stroke-width="5" />
<path d="M131,2421 H208" stroke="#FFA74B" stroke-width="9" stroke-linecap="round" />
<path d="M1165,2566 H1243" stroke="#FFA74B" stroke-width="7" stroke-linecap="round" />
<text x="142" y="2448" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">ARCHIVES</text>
<text x="144.00" y="2497.5" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="37" font-weight="700"><tspan x="144.00" dy="0">Nous avons ouvert le passage, puis attendu de voir</tspan><tspan x="144.00" dy="45">ce qui se produirait. Et c’est alors que tu es apparu.</tspan></text></g>
<g id="CH05_P04_L005" data-speaker="CHR_035" data-frame="5" data-kind="magnet">
<path d="M2080,2046 Q2130,2100 2170,2148" fill="none" stroke="#38BED6" stroke-width="6" stroke-linecap="round" /><circle cx="2170" cy="2148" r="8" fill="#F4AB54" stroke="#38BED6" stroke-width="4" /><rect x="1635" y="1831" width="772" height="238" rx="28" fill="#040715" opacity=".22" /><rect x="1630" y="1824" width="772" height="238" rx="28" fill="#E2F8FF" stroke="#38BED6" stroke-width="5" /><circle cx="1656" cy="1849" r="7" fill="#F4AB54" /><text x="2016" y="1885.6" text-anchor="middle" fill="#143855" font-family="DejaVu Sans" font-size="36" font-weight="700"><tspan x="2016" dy="0">Nous avons décidé que je partirais</tspan><tspan x="2016" dy="44">avec vous pour vous aider à les</tspan><tspan x="2016" dy="44">rejoindre. Ils pourront expliquer</tspan><tspan x="2016" dy="44">pourquoi ils t’ont sauvé.</tspan></text></g>
