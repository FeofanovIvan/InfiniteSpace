<path d="M120,699 H197" stroke="#FFA74B" stroke-width="9" stroke-linecap="round"/>
<path d="M1059,859 H1137" stroke="#FFA74B" stroke-width="7" stroke-linecap="round"/>
<text x="131" y="726" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">АРХИВ</text>
<text x="133.00" y="784.10" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="35" font-weight="700">
<tspan x="133.00" dy="0">Мы обнаружили огромные гравитационные</tspan>
<tspan x="133.00" dy="44">туннели и научились связывать их между собой.</tspan>
</text></g>
<g id="CH05_P04_L002" data-speaker="CHR_037" data-frame="2" data-kind="archive">
<path d="M131,1463 H1191 L1216,1488 V1657 L1191,1682 H131 L106,1657 V1488 Z" fill="#020714" opacity=".35"/>
<path d="M125,1454 H1185 L1210,1479 V1648 L1185,1673 H125 L100,1648 V1479 Z" fill="#102344" fill-opacity=".96" stroke="#3BC7E6" stroke-width="5"/>
<path d="M126,1475 H203" stroke="#FFA74B" stroke-width="9" stroke-linecap="round"/>
<path d="M1100,1653 H1178" stroke="#FFA74B" stroke-width="7" stroke-linecap="round"/>
<text x="137" y="1502" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">АРХИВ</text>
<text x="139.00" y="1546.56" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="36" font-weight="700">
<tspan x="139.00" dy="0">Когда мы давным-давно прибыли в этот мир,</tspan>
<tspan x="139.00" dy="45">местные существа помогли нам освоиться. Мы</tspan>
<tspan x="139.00" dy="45">до сих пор поддерживаем с ними связь.</tspan>
</text></g>
<g id="CH05_P04_L003" data-speaker="CHR_037" data-frame="3" data-kind="archive">
<path d="M1401,1441 H2346 L2371,1466 V1646 L2346,1671 H1401 L1376,1646 V1466 Z" fill="#020714" opacity=".35"/>
<path d="M1395,1432 H2340 L2365,1457 V1637 L2340,1662 H1395 L1370,1637 V1457 Z" fill="#102344" fill-opacity=".96" stroke="#3BC7E6" stroke-width="5"/>
<path d="M1396,1453 H1473" stroke="#FFA74B" stroke-width="9" stroke-linecap="round"/>
<path d="M2255,1642 H2333" stroke="#FFA74B" stroke-width="7" stroke-linecap="round"/>
<text x="1407" y="1480" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">АРХИВ</text>
<text x="1409.00" y="1528.02" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="37" font-weight="700">
<tspan x="1409.00" dy="0">Недавно мы получили от них сигнал: они</tspan>
<tspan x="1409.00" dy="47">попросили открыть туннель из твоего</tspan>
<tspan x="1409.00" dy="47">мира в наш.</tspan>
</text></g>
<g id="CH05_P04_L004" data-speaker="CHR_037" data-frame="4" data-kind="archive">
<path d="M136,2409 H1256 L1281,2434 V2570 L1256,2595 H136 L111,2570 V2434 Z" fill="#020714" opacity=".35"/>
<path d="M130,2400 H1250 L1275,2425 V2561 L1250,2586 H130 L105,2561 V2425 Z" fill="#102344" fill-opacity=".96" stroke="#3BC7E6" stroke-width="5"/>
<path d="M131,2421 H208" stroke="#FFA74B" stroke-width="9" stroke-linecap="round"/>
<path d="M1165,2566 H1243" stroke="#FFA74B" stroke-width="7" stroke-linecap="round"/>
<text x="142" y="2448" fill="#FFA74B" font-family="DejaVu Sans" font-size="23" font-weight="700">АРХИВ</text>
<text x="144.00" y="2497.48" text-anchor="start" fill="#F8FDFF" font-family="DejaVu Sans" font-size="38" font-weight="700">
<tspan x="144.00" dy="0">Мы открыли проход и стали ждать, к чему это</tspan>
<tspan x="144.00" dy="48">приведёт. А вскоре появился ты.</tspan>
</text></g>
<g id="CH05_P04_L005" data-speaker="CHR_035" data-frame="5" data-kind="magnet">
<path d="M2080,2046 Q2130,2100 2170,2148" fill="none" stroke="#38BED6" stroke-width="6" stroke-linecap="round"/><circle cx="2170" cy="2148" r="8" fill="#F4AB54" stroke="#38BED6" stroke-width="4"/><rect x="1635" y="1831" width="772" height="238" rx="28" fill="#040715" opacity=".22"/><rect x="1630" y="1824" width="772" height="238" rx="28" fill="#E2F8FF" stroke="#38BED6" stroke-width="5"/><circle cx="1656" cy="1849" r="7" fill="#F4AB54"/><text x="2016" y="1888" text-anchor="middle" fill="#143855" font-family="DejaVu Sans" font-size="38" font-weight="700"><tspan x="2016" dy="0">Мы решили: я полечу с вами и</tspan><tspan x="2016" dy="49">помогу добраться до этих</tspan><tspan x="2016" dy="49">существ. Они подскажут,</tspan><tspan x="2016" dy="49">зачем спасли тебя.</tspan></text></g>
