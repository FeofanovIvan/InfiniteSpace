<text x="1678.00" y="2812.06" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="36" font-weight="700">
<tspan x="1678.00" dy="0">Магнитный друг полетел с</tspan><tspan x="1678.00" dy="45">экипажем и указал путь в</tspan><tspan x="1678.00" dy="45">неизвестную Мике часть</tspan><tspan x="1678.00" dy="45">космоса — к его спасителям.</tspan></text></g>
