<text x="1871.0" y="146.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#F7FAFF"><tspan x="1871.0" dy="0">Mika commença à régler</tspan><tspan x="1871.0" dy="38">les archives. D’étranges</tspan><tspan x="1871.0" dy="38">images surgirent</tspan><tspan x="1871.0" dy="38">au-dessus du pupitre,</tspan><tspan x="1871.0" dy="38">puis une voix retentit.</tspan></text></g>
