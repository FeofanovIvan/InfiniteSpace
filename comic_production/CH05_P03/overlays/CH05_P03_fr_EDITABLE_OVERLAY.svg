<text x="97.0" y="1994.7" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#F8FBFF"><tspan x="97.0" dy="0">Autrefois, nous avions un aspect un peu différent et</tspan><tspan x="97.0" dy="42">vivions dans un autre monde.</tspan></text></g>
