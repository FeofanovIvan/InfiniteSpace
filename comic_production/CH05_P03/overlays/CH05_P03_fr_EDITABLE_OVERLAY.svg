<text x="1237.5" y="859.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#173D56"><tspan x="1237.5" dy="0">Voici les Archives</tspan><tspan x="1237.5" dy="36">centrales.</tspan><tspan x="1237.5" dy="36">Personnalise-les, et</tspan><tspan x="1237.5" dy="36">elles te donneront</tspan><tspan x="1237.5" dy="36">toutes les</tspan><tspan x="1237.5" dy="36">informations dont tu</tspan><tspan x="1237.5" dy="36">as besoin.</tspan></text></g>
