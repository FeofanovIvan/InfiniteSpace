<text x="1237.5" y="877.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#173D56"><tspan x="1237.5" dy="0">Das ist das</tspan><tspan x="1237.5" dy="36">Zentralarchiv. Richte</tspan><tspan x="1237.5" dy="36">es für dich ein, dann</tspan><tspan x="1237.5" dy="36">liefert es dir alle</tspan><tspan x="1237.5" dy="36">Informationen, die</tspan><tspan x="1237.5" dy="36">du brauchst.</tspan></text></g>
