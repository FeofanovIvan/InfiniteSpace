<text x="97.0" y="1994.7" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#F8FBFF"><tspan x="97.0" dy="0">Früher sahen wir etwas anders aus und lebten in</tspan><tspan x="97.0" dy="42">einer anderen Welt.</tspan></text></g>
