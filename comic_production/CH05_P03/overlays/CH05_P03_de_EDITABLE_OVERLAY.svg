<text x="1871.0" y="146.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#F7FAFF"><tspan x="1871.0" dy="0">Mika begann, das Archiv</tspan><tspan x="1871.0" dy="38">einzustellen. Über dem</tspan><tspan x="1871.0" dy="38">Pult erschienen seltsame</tspan><tspan x="1871.0" dy="38">Bilder, und eine Stimme</tspan><tspan x="1871.0" dy="38">erklang.</tspan></text></g>
