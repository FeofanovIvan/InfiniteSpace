<text x="169" y="3135" fill="#182745" font-size="18" text-anchor="middle" font-family="DejaVu Sans" font-weight="700">АРХИВ</text>
<text x="121.0" y="3196.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#F8FBFF">
<tspan x="121.0" dy="0">К тому времени мы уже изучили гравитационные</tspan>
<tspan x="121.0" dy="42">аномалии и научились проходить сквозь них. Так мы</tspan>
<tspan x="121.0" dy="42">смогли покинуть прежний мир.</tspan>
