<path d="M 1388 1915 h 54" stroke="#FFA957" stroke-width="7" stroke-linecap="round"/>
<path d="M 2313 2053 h 51" stroke="#FFA957" stroke-width="6" stroke-linecap="round"/>
<rect x="1387" y="1923" width="104" height="27" rx="8" fill="#F0AC56"/>
<text x="1439" y="1943" fill="#182745" font-size="18" text-anchor="middle" font-family="DejaVu Sans" font-weight="700">АРХИВ</text>
<text x="1391.0" y="1995.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#F8FBFF">
<tspan x="1391.0" dy="0">Но нас тоже настиг шторм. Нам пришлось</tspan>
<tspan x="1391.0" dy="43">эвакуироваться.</tspan>
</text></g>
<g id="CH05_P03_L006" data-kind="archive" data-speaker="Центральный архив" data-frame="F05">
