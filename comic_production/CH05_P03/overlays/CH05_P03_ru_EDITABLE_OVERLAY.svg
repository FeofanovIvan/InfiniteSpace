<path d="M 1868 102 h 54" stroke="#F9AD53" stroke-width="7" stroke-linecap="round"/>
<path d="M 2276 317 h 51" stroke="#F9AD53" stroke-width="6" stroke-linecap="round"/>
<text x="1871.0" y="152.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#F7FAFF">
<tspan x="1871.0" dy="0">Мика начал</tspan>
<tspan x="1871.0" dy="40">настраивать архив. Над</tspan>
<tspan x="1871.0" dy="40">пультом замелькали</tspan>
<tspan x="1871.0" dy="40">странные изображения,</tspan>
<tspan x="1871.0" dy="40">и зазвучал голос.</tspan>
</text></g>
<g id="CH05_P03_L004" data-kind="archive" data-speaker="Центральный архив" data-frame="F03">
