<rect x="1040" y="812" width="395" height="284" rx="23" fill="#E4F8FB" fill-opacity="0.97" stroke="#53C5DE" stroke-width="4"/>
<path d="M 1063 829 h 54" stroke="#F6A24C" stroke-width="7" stroke-linecap="round"/>
<text x="1237.5" y="879.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#173D56">
<tspan x="1237.5" dy="0">Это центральный</tspan>
<tspan x="1237.5" dy="40">архив. Настрой</tspan>
<tspan x="1237.5" dy="40">его под себя — и</tspan>
<tspan x="1237.5" dy="40">он выдаст всю</tspan>
<tspan x="1237.5" dy="40">необходимую</tspan>
<tspan x="1237.5" dy="40">информацию.</tspan>
</text></g>
