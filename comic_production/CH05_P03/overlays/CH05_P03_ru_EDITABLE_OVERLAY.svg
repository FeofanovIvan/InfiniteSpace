<text x="145" y="1943" fill="#182745" font-size="18" text-anchor="middle" font-family="DejaVu Sans" font-weight="700">АРХИВ</text>
<text x="97.0" y="1995.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#F8FBFF">
<tspan x="97.0" dy="0">Когда-то мы выглядели немного иначе и жили в</tspan>
<tspan x="97.0" dy="43">другом мире.</tspan>
</text></g>
<g id="CH05_P03_L005" data-kind="archive" data-speaker="Центральный архив" data-frame="F04">
