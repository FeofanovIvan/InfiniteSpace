<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508">
<rect x="0" y="0" width="2480" height="3508" fill="none"/>
<g id="CH03_P04_L001">
<rect x="128" y="15" width="2230" height="106" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="125" y="8" width="2230" height="106" rx="23" fill="#FFF9F0" stroke="#9671C6" stroke-width="5"/>
<rect x="156" y="26" width="72" height="8" rx="4" fill="#F0A14E"/>
<text x="159" y="68.00" font-family="DejaVu Sans" font-size="35" font-weight="700" fill="#2B2445" text-anchor="start">
<tspan x="159" dy="0">One of the leaders of the Living Archive invited Mika and his companions and began his story.</tspan>
</text>
</g>
<g id="CH03_P04_L002">
<rect x="933" y="1335" width="520" height="96" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="930" y="1328" width="520" height="96" rx="23" fill="#FFE6B0" stroke="#D5A13B" stroke-width="5"/>
<rect x="961" y="1346" width="72" height="8" rx="4" fill="#F1AF44"/>
<text x="1190.0" y="1391.05" font-family="DejaVu Sans" font-size="43" font-weight="700" fill="#3C284D" text-anchor="middle">
<tspan x="1190.0" dy="0">Like water?</tspan>
</text>
</g>
<g id="CH03_P04_L003">
<rect x="1583" y="497" width="825" height="308" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="1580" y="490" width="825" height="308" rx="23" fill="#122D53" stroke="#29D9ED" stroke-width="5"/>
<rect x="1611" y="508" width="72" height="8" rx="4" fill="#FAB65A"/>
<text x="1614" y="559.00" font-family="DejaVu Sans" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="start">
<tspan x="1614" dy="0">We are not called Phase</tspan>
<tspan x="1614" dy="53.68">Beings by accident. Our lives</tspan>
<tspan x="1614" dy="53.68">pass through three states.</tspan>
</text>
</g>
<g id="CH03_P04_L004">
<rect x="48" y="1603" width="570" height="305" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="45" y="1596" width="570" height="305" rx="23" fill="#E6F7FC" stroke="#27B8CF" stroke-width="5"/>
<rect x="76" y="1614" width="72" height="8" rx="4" fill="#F5B05B"/>
<text x="79" y="1654.00" font-family="DejaVu Sans" font-size="33" font-weight="700" fill="#21344F" text-anchor="start">
<tspan x="79" dy="0">Not exactly. We are born</tspan>
<tspan x="79" dy="40.26">in a more gaseous state:</tspan>
<tspan x="79" dy="40.26">our molecules are far</tspan>
<tspan x="79" dy="40.26">apart from one another.</tspan>
</text>
</g>
<g id="CH03_P04_L005">
<rect x="48" y="1921" width="570" height="333" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="45" y="1914" width="570" height="333" rx="23" fill="#E6F7FC" stroke="#27B8CF" stroke-width="5"/>
<rect x="76" y="1932" width="72" height="8" rx="4" fill="#F5B05B"/>
<text x="79" y="1975.00" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#21344F" text-anchor="start">
<tspan x="79" dy="0">Over time we grow</tspan>
<tspan x="79" dy="43.92">denser and take on a</tspan>
<tspan x="79" dy="43.92">liquid or jelly-like form.</tspan>
<tspan x="79" dy="43.92">And at the end of life,</tspan>
<tspan x="79" dy="43.92">we crystallize.</tspan>
</text>
</g>
<g id="CH03_P04_L006">
<rect x="1908" y="1595" width="550" height="307" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="1905" y="1588" width="550" height="307" rx="23" fill="#F1EAFF" stroke="#A27ACD" stroke-width="5"/>
<rect x="1936" y="1606" width="72" height="8" rx="4" fill="#F5B05B"/>
<text x="1939" y="1647.00" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#30264D" text-anchor="start">
<tspan x="1939" dy="0">According to one of our</tspan>
<tspan x="1939" dy="41.48">theories, we descended</tspan>
<tspan x="1939" dy="41.48">from ancient cosmic</tspan>
<tspan x="1939" dy="41.48">crystals that can even</tspan>
<tspan x="1939" dy="41.48">be found on asteroids.</tspan>
</text>
</g>
<g id="CH03_P04_L007">
<rect x="1908" y="1914" width="550" height="337" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="1905" y="1907" width="550" height="337" rx="23" fill="#FFF0C3" stroke="#D29A33" stroke-width="5"/>
<rect x="1936" y="1925" width="72" height="8" rx="4" fill="#37C9D9"/>
<text x="1939" y="1964.00" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#352646" text-anchor="start">
<tspan x="1939" dy="0">Perhaps that became our</tspan>
<tspan x="1939" dy="39.04">misfortune. Other races</tspan>
<tspan x="1939" dy="39.04">see the crystals left after</tspan>
<tspan x="1939" dy="39.04">us as being just as</tspan>
<tspan x="1939" dy="39.04">valuable as the ones</tspan>
<tspan x="1939" dy="39.04">mined in space.</tspan>
</text>
</g>
<g id="CH03_P04_L008">
<rect x="768" y="1523" width="940" height="97" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="765" y="1516" width="940" height="97" rx="23" fill="#FFF0D5" stroke="#BB88BC" stroke-width="5"/>
<rect x="796" y="1534" width="72" height="8" rx="4" fill="#F0A14E"/>
<text x="1235.0" y="1574.65" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#34234D" text-anchor="middle">
<tspan x="1235.0" dy="0">But to us, they are the memory of our ancestors.</tspan>
</text>
</g>
<g id="CH03_P04_L009">
<rect x="413" y="2257" width="1660" height="83" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="410" y="2250" width="1660" height="83" rx="23" fill="#FFF9F0" stroke="#9671C6" stroke-width="5"/>
<rect x="441" y="2268" width="72" height="8" rx="4" fill="#F0A14E"/>
<text x="1240.0" y="2303.40" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#2B2445" text-anchor="middle">
<tspan x="1240.0" dy="0">And I want to thank you for helping stop the lizard.</tspan>
</text>
</g>
<g id="CH03_P04_L010">
<rect x="91" y="3062" width="860" height="250" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="88" y="3055" width="860" height="250" rx="23" fill="#E6F7FC" stroke="#27B8CF" stroke-width="5"/>
<rect x="119" y="3073" width="72" height="8" rx="4" fill="#F5B05B"/>
<text x="122" y="3117.00" font-family="DejaVu Sans" font-size="37" font-weight="700" fill="#21344F" text-anchor="start">
<tspan x="122" dy="0">I would like to introduce my son, the</tspan>
<tspan x="122" dy="45.14">prince of our people. I propose that</tspan>
<tspan x="122" dy="45.14">he travel with you.</tspan>
</text>
</g>
<g id="CH03_P04_L011">
<rect x="1048" y="2347" width="1360" height="245" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="1045" y="2340" width="1360" height="245" rx="23" fill="#122D53" stroke="#29D9ED" stroke-width="5"/>
<rect x="1076" y="2358" width="72" height="8" rx="4" fill="#FAB65A"/>
<text x="1079" y="2409.00" font-family="DejaVu Sans" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="start">
<tspan x="1079" dy="0">I cannot answer your questions about your home</tspan>
<tspan x="1079" dy="53.68">planet, Mika. But I will help you continue</tspan>
<tspan x="1079" dy="53.68">onward—to the Barnard Galaxy.</tspan>
</text>
</g>
<g id="CH03_P04_L012">
<rect x="1158" y="3311" width="1160" height="102" rx="23" fill="#17122E" opacity="0.15"/>
<rect x="1155" y="3304" width="1160" height="102" rx="23" fill="#FFF0C3" stroke="#D29A33" stroke-width="5"/>
<rect x="1186" y="3322" width="72" height="8" rx="4" fill="#37C9D9"/>
<text x="1735.0" y="3369.00" font-family="DejaVu Sans" font-size="40" font-weight="700" fill="#352646" text-anchor="middle">
<tspan x="1735.0" dy="0">But be careful: there are many pirates there!</tspan>
</text>
</g>
</svg>