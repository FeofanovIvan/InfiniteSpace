<g id="CH08_FINAL_L001" data-speaker="CHR_004" data-kind="author_caption" data-style="NEBULA_AUTHOR_NARRATION"><rect x="130" y="115" width="2220" height="338" rx="32" fill="#162A4E" fill-opacity="0.97" stroke="#70DFF4" stroke-width="5.2"/><path d="M164 145 H234" stroke="#FFA83A" stroke-width="5" stroke-linecap="round"/><circle cx="2310" cy="145" r="6" fill="#FFA83A"/><text x="196" y="228.5" font-family="DejaVu Sans" font-weight="700" font-size="46" fill="#FFFFFF">Ce dessin représente le nouveau monde de Mika.</text><text x="196" y="288.3" font-family="DejaVu Sans" font-weight="700" font-size="46" fill="#FFFFFF">Mais les lois de la physique de notre monde ne nous permettent pas de le voir.</text><text x="196" y="348.1" font-family="DejaVu Sans" font-weight="700" font-size="46" fill="#FFFFFF">Tu peux y ajouter tes propres couleurs.</text></g>
</svg>