<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 2480 3508">
<title>MIKA final creative A4 — fr</title>
<desc>One navy narrator caption; the rest of the A4 page is plain white for the child's own drawing.</desc>
