<g id="CH08_FINAL_L001" data-speaker="CHR_004" data-kind="author_caption" data-style="NEBULA_AUTHOR_NARRATION"><rect x="130" y="115" width="2220" height="338" rx="32" fill="#162A4E" fill-opacity="0.97" stroke="#70DFF4" stroke-width="5.2"/><path d="M164 145 H234" stroke="#FFA83A" stroke-width="5" stroke-linecap="round"/><circle cx="2310" cy="145" r="6" fill="#FFA83A"/><text x="196" y="231.1" font-family="DejaVu Sans" font-weight="700" font-size="49" fill="#FFFFFF">На этом рисунке изображён новый мир Мики.</text><text x="196" y="294.8" font-family="DejaVu Sans" font-weight="700" font-size="49" fill="#FFFFFF">Но наши физические законы не позволяют нам его увидеть.</text><text x="196" y="358.5" font-family="DejaVu Sans" font-weight="700" font-size="49" fill="#FFFFFF">Но ты можешь добавить ему красок.</text></g>
