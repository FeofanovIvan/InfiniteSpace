<text x="832" y="142.05" font-family="DejaVu Sans" font-weight="700" font-size="35" fill="#174C41">Não se preocupe. Sou o mesmo</text><text x="832" y="184.05" font-family="DejaVu Sans" font-weight="700" font-size="35" fill="#174C41">planeta. Só fica mais fácil para você</text><text x="832" y="226.05" font-family="DejaVu Sans" font-weight="700" font-size="35" fill="#174C41">me entender quando me pareço com</text><text x="832" y="268.05" font-family="DejaVu Sans" font-weight="700" font-size="35" fill="#174C41">você.</text></g>
