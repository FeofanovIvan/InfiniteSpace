<text x="114" y="3413.17" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">Los seres neuronales saben dónde y cuándo</text><text x="114" y="3447.97" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">ocurrirán las cosas.</text></g>
<g id="CH07_P02_L009" data-layout-style="mika" data-role="CHR_001">
