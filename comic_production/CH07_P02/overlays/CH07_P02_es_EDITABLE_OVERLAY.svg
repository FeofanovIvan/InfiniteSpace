<text x="1304" y="2068.17" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">Y abrir portales entre</text><text x="1304" y="2102.97" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">regiones del espacio.</text></g>
<g id="CH07_P02_L008" data-layout-style="label" data-role="CHR_001">
