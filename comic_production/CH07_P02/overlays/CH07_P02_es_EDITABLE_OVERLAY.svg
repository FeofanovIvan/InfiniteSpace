<text x="782" y="1274.74" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#19364F">Empecé a pensar en los patrones.</text></g>
<g id="CH07_P02_L004_visual_a" data-layout-style="label" data-role="CHR_001">
<rect x="74" y="1822" width="460" height="124" rx="24" fill="#FFFFFF" fill-opacity="0.9" stroke="#C8D7E6" stroke-width="2.6"/>
<text x="95" y="1876.71" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">Un meteorito cayó en la</text><text x="95" y="1909.11" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">Tierra.</text></g>
<g id="CH07_P02_L004_visual_b" data-layout-style="label" data-role="CHR_001">
<rect x="545" y="1822" width="555" height="124" rx="24" fill="#FFFFFF" fill-opacity="0.9" stroke="#C8D7E6" stroke-width="2.6"/>
<text x="566" y="1876.71" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">Otro en el mundo del moho,</text><text x="566" y="1909.11" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">antes de su civilización.</text></g>
<g id="CH07_P02_L005_visual_a" data-layout-style="label" data-role="CHR_001">
