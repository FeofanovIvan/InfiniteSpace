<text x="107" y="2050.77" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">Los seres magnéticos</text><text x="107" y="2085.57" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">pueden controlar</text><text x="107" y="2120.37" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">asteroides.</text></g>
<g id="CH07_P02_L007" data-layout-style="mika" data-role="CHR_001">
