<text x="566" y="1876.71" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">Another hit the mold world,</text><text x="566" y="1909.11" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">before civilization.</text></g>
<g id="CH07_P02_L005_visual_a" data-layout-style="label" data-role="CHR_001">
