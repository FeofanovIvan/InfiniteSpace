<text x="107" y="2068.17" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">The magnetic beings</text><text x="107" y="2102.97" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">can control asteroids.</text></g>
<g id="CH07_P02_L007" data-layout-style="mika" data-role="CHR_001">
