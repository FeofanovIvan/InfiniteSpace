<text x="1241" y="1871.71" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">The phase beings arose from</text><text x="1241" y="1904.11" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">meteorites.</text></g>
<g id="CH07_P02_L005_visual_b" data-layout-style="label" data-role="CHR_001">
