<text x="1823" y="1871.71" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">An asteroid changed the air. The</text><text x="1823" y="1904.11" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#19364F">lizards became symbiotic.</text></g>
<g id="CH07_P02_L006" data-layout-style="mika" data-role="CHR_001">
