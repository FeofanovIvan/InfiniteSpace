<circle cx="1468" cy="982" r="5" fill="#5BB9C6"/>
<text x="917" y="1010.03" font-family="DejaVu Sans" font-weight="700" font-size="31" fill="#174C41">Tell me how you solved the</text><text x="917" y="1047.23" font-family="DejaVu Sans" font-weight="700" font-size="31" fill="#174C41">puzzle and found your way to</text><text x="917" y="1084.43" font-family="DejaVu Sans" font-weight="700" font-size="31" fill="#174C41">me.</text></g>
