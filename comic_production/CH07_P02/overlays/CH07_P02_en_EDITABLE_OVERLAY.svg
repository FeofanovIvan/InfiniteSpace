<text x="114" y="3413.17" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">The neuron beings know where and when</text><text x="114" y="3447.97" font-family="DejaVu Sans" font-weight="700" font-size="29" fill="#19364F">things will happen.</text></g>
