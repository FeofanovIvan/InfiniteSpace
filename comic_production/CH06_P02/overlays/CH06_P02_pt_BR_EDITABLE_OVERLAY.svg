<path d="M120 1048 h57" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="777" cy="1048" r="5.5" fill="#36DDE8"/>
<text x="120" y="1106.2" font-family="DejaVu Sans" font-weight="700" font-size="40" fill="#18344A">E começamos a explorar o</text><text x="120" y="1156.2" font-family="DejaVu Sans" font-weight="700" font-size="40" fill="#18344A">Universo que conhecíamos.</text></g>
<g id="CH06_P02_L005" data-speaker="CHR_038" data-kind="telepathic_narration" data-shape="nebula-speech-right" data-voice-mode="offscreen">
<path d="M1056 1466 Q1030 1466 1030 1492 V1615 Q1030 1641 1056 1641 H2115 L2185 1668 L2165 1641 H2229 Q2255 1641 2255 1615 V1492 Q2255 1466 2229 1466 Z" fill="#4ED0DB" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M1060 1482 h57" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="2227" cy="1482" r="5.5" fill="#36DDE8"/>
<text x="1060" y="1539.32" font-family="DejaVu Sans" font-weight="700" font-size="39" fill="#18344A">Aprendemos a prever o nascimento e a morte das</text><text x="1060" y="1588.07" font-family="DejaVu Sans" font-weight="700" font-size="39" fill="#18344A">galáxias.</text></g>
<g id="CH06_P02_L006" data-speaker="CHR_001" data-kind="dialogue" data-shape="nebula-speech-left" data-voice-mode="offscreen">
<path d="M838 1802 Q812 1802 812 1828 V1971 Q812 1997 838 1997 H905 L882 2024 L949 1997 H1406 Q1432 1997 1432 1971 V1828 Q1432 1802 1406 1802 Z" fill="#FFFDF9" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M842 1818 h57" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="1404" cy="1818" r="5.5" fill="#36DDE8"/>
<text x="842" y="1873.56" font-family="DejaVu Sans" font-weight="700" font-size="37" fill="#18344A">Então vocês conseguem</text><text x="842" y="1919.81" font-family="DejaVu Sans" font-weight="700" font-size="37" fill="#18344A">prever o futuro?</text></g>
<g id="CH06_P02_L007" data-speaker="CHR_038" data-kind="telepathic_narration" data-shape="nebula-speech-right" data-voice-mode="offscreen">
<path d="M1296 2483 Q1270 2483 1270 2509 V2654 Q1270 2680 1296 2680 H2260 L2330 2707 L2310 2680 H2374 Q2400 2680 2400 2654 V2509 Q2400 2483 2374 2483 Z" fill="#4ED0DB" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M1300 2499 h57" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="2372" cy="2499" r="5.5" fill="#36DDE8"/>
<text x="1300" y="2552.8" font-family="DejaVu Sans" font-weight="700" font-size="35" fill="#18344A">Assim como você pode prever quanto falta para</text><text x="1300" y="2596.55" font-family="DejaVu Sans" font-weight="700" font-size="35" fill="#18344A">amanhecer se souber que horas são e a que horas o</text><text x="1300" y="2640.3" font-family="DejaVu Sans" font-weight="700" font-size="35" fill="#18344A">Sol vai nascer.</text></g>
<g id="CH06_P02_L008" data-speaker="CHR_038" data-kind="telepathic_narration" data-tts-segments="1" data-display-segments="5">
