<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508">
<title>MIKA CH06 P02 — русский NEBULA SVG v5: без дублей, безопасные отступы</title>
<desc>Никакой генерации изображений. Бирюзовая закадровая речь нейронных существ, белая речь Мики. Подписи космических явлений видимы по одному разу.</desc>
<g id="CH06_P02_L001" data-speaker="CHR_038" data-kind="telepathic_narration" data-shape="nebula-speech-left" data-voice-mode="offscreen">
<path d="M626 270 Q600 270 600 296 V534 Q600 560 626 560 H693 L670 587 L737 560 H1179 Q1205 560 1205 534 V296 Q1205 270 1179 270 Z" fill="#4ED0DB" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M630 286 h57" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="1177" cy="286" r="5.5" fill="#36DDE8"/>
<text x="630" y="338.92" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">Olá, Mika! Que bom que</text><text x="630" y="381.42" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">você chegou até nós. Quero</text><text x="630" y="423.92" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">te contar um pouco sobre</text><text x="630" y="466.42" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">nós e o que aconteceu.</text></g>
<g id="CH06_P02_L002" data-speaker="CHR_038" data-kind="telepathic_narration" data-shape="nebula-speech-right" data-voice-mode="offscreen">
<path d="M551 605 Q525 605 525 631 V767 Q525 793 551 793 H1075 L1145 820 L1125 793 H1189 Q1215 793 1215 767 V631 Q1215 605 1189 605 Z" fill="#4ED0DB" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M555 621 h57" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="1187" cy="621" r="5.5" fill="#36DDE8"/>
<text x="555" y="673.04" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#18344A">Quando olhamos para o céu pela</text><text x="555" y="714.29" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#18344A">primeira vez, começamos a</text><text x="555" y="755.54" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#18344A">perceber padrões.</text></g>
<g id="CH06_P02_L003" data-speaker="CHR_038" data-kind="telepathic_narration" data-shape="nebula-speech-right" data-voice-mode="offscreen">
<path d="M1414 105 Q1388 105 1388 131 V251 Q1388 277 1414 277 H2155 L2225 304 L2205 277 H2269 Q2295 277 2295 251 V131 Q2295 105 2269 105 Z" fill="#4ED0DB" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M1418 121 h57" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="2267" cy="121" r="5.5" fill="#36DDE8"/>
<text x="1418" y="182.72" font-family="DejaVu Sans" font-weight="700" font-size="44" fill="#18344A">Construímos naves espaciais.</text></g>
<g id="CH06_P02_L004" data-speaker="CHR_038" data-kind="telepathic_narration" data-shape="nebula-speech-left" data-voice-mode="offscreen">
