<text text-anchor="middle" x="500.0" y="2543.1" fill="#302046" font-family="DejaVu Sans" font-size="42" font-weight="700">
<tspan x="500.0" dy="0">Вы ждали меня? Значит, вы</tspan>
<tspan x="500.0" dy="52">знаете, откуда я?</tspan>
</text></g>
<g id="CH05_P02_L012" data-frame="5" data-speaker="Магнитное существо" data-kind="magnet">
<path d="M 965 3072 Q 945 3033 900 3025" fill="none" stroke="#2BBBD2" stroke-width="9" stroke-linecap="round"/><circle cx="900" cy="3025" r="7" fill="#E4FAFD" stroke="#2BBBD2" stroke-width="3"/><rect x="355" y="3079" width="745" height="294" rx="25" fill="#020713" opacity=".23"/><rect x="350" y="3072" width="745" height="294" rx="25" fill="#E4FAFD" stroke="#2BBBD2" stroke-width="5.5"/><circle cx="372" cy="3093" r="6" fill="#E78C35"/><text text-anchor="middle" x="722.5" y="3125.2" fill="#103D56" font-family="DejaVu Sans" font-size="35" font-weight="700"><tspan x="722.5" dy="0">Не спеши. Мы всё объясним.</tspan><tspan x="722.5" dy="42">Отправляйся на нашу станцию —</tspan><tspan x="722.5" dy="42">«Перевёрнутая пирамида». Там</tspan><tspan x="722.5" dy="42">хранятся знания, которые</tspan><tspan x="722.5" dy="42">помогут тебе понять, что</tspan><tspan x="722.5" dy="42">происходит.</tspan></text></g>
