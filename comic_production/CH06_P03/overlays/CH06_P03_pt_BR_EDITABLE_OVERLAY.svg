<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508">
<title>MIKA CH06 P03 — русский черновик v1. NEBULA offscreen speech</title>
<desc>Только векторные речевые облака поверх оригинального PDF; никакой перерисовки. Картотека NEBULA: speech_left / speech_right.</desc>
<g id="CH06_P03_L001" data-speaker="CHR_038" data-kind="offscreen_neuron_speech" data-shape="nebula-speech-left" data-voice-mode="offscreen">
<path d="M127 990 Q100 990 100 1017 V1148 Q100 1175 127 1175 H206 L182 1202 L253 1175 H1103 Q1130 1175 1130 1148 V1017 Q1130 990 1103 990 Z" fill="#4ED0DB" fill-opacity="0.97" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M132 1007 h58" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="1100" cy="1007" r="5.6" fill="#36DDE8"/>
<text x="130" y="1065.08" font-family="DejaVu Sans" font-weight="700" font-size="41" fill="#18344A">Mas depois descobrimos estranhas</text><text x="130" y="1116.33" font-family="DejaVu Sans" font-weight="700" font-size="41" fill="#18344A">anomalias naturais.</text></g>
<g id="CH06_P03_L002" data-speaker="CHR_038" data-kind="offscreen_neuron_speech" data-shape="nebula-speech-right" data-voice-mode="offscreen">
<path d="M1207 990 Q1180 990 1180 1017 V1148 Q1180 1175 1207 1175 H2214 L2293 1202 L2272 1175 H2343 Q2370 1175 2370 1148 V1017 Q2370 990 2343 990 Z" fill="#4ED0DB" fill-opacity="0.97" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M1212 1007 h58" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="2340" cy="1007" r="5.6" fill="#36DDE8"/>
<text x="1210" y="1058.92" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">Para entender como elas funcionavam, tivemos de</text><text x="1210" y="1101.42" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">estudar a natureza do Universo ainda mais</text><text x="1210" y="1143.92" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">profundamente.</text></g>
<g id="CH06_P03_L003" data-speaker="CHR_038" data-kind="offscreen_neuron_speech" data-shape="nebula-speech-left" data-voice-mode="offscreen">
<path d="M122 1985 Q95 1985 95 2012 V2148 Q95 2175 122 2175 H201 L177 2202 L248 2175 H1263 Q1290 2175 1290 2148 V2012 Q1290 1985 1263 1985 Z" fill="#4ED0DB" fill-opacity="0.97" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M127 2002 h58" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="1260" cy="2002" r="5.6" fill="#36DDE8"/>
<text x="125" y="2056.56" font-family="DejaVu Sans" font-weight="700" font-size="37" fill="#18344A">Ao investigar uma dessas anomalias, encontramos</text><text x="125" y="2102.81" font-family="DejaVu Sans" font-weight="700" font-size="37" fill="#18344A">aqueles seres magnéticos que você já conhece.</text></g>
<g id="CH06_P03_L004" data-speaker="CHR_038" data-kind="offscreen_neuron_speech" data-shape="nebula-speech-right" data-voice-mode="offscreen">
<path d="M1467 1330 Q1440 1330 1440 1357 V1487 Q1440 1514 1467 1514 H2209 L2288 1541 L2267 1514 H2338 Q2365 1514 2365 1487 V1357 Q2365 1330 2338 1330 Z" fill="#4ED0DB" fill-opacity="0.97" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M1472 1347 h58" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="2335" cy="1347" r="5.6" fill="#36DDE8"/>
<text x="1470" y="1398.92" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">E mais adiante, nas profundezas do espaço,</text><text x="1470" y="1441.42" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#18344A">descobrimos um artefato surpreendente.</text></g>
<g id="CH06_P03_L005" data-speaker="CHR_038" data-kind="offscreen_neuron_speech" data-shape="nebula-speech-left" data-voice-mode="offscreen">
<path d="M1547 2002 Q1520 2002 1520 2029 V2140 Q1520 2167 1547 2167 H1626 L1602 2194 L1673 2167 H2337 Q2364 2167 2364 2140 V2029 Q2364 2002 2337 2002 Z" fill="#4ED0DB" fill-opacity="0.97" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M1552 2019 h58" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="2334" cy="2019" r="5.6" fill="#36DDE8"/>
<text x="1550" y="2073.56" font-family="DejaVu Sans" font-weight="700" font-size="37" fill="#18344A">Ele se revelou o centro de muitas</text><text x="1550" y="2119.81" font-family="DejaVu Sans" font-weight="700" font-size="37" fill="#18344A">zonas anômalas.</text></g>
<g id="CH06_P03_L006" data-speaker="CHR_038" data-kind="offscreen_neuron_speech" data-shape="nebula-speech-left" data-voice-mode="offscreen">
<path d="M137 3206 Q110 3206 110 3233 V3361 Q110 3388 137 3388 H216 L192 3415 L263 3388 H1323 Q1350 3388 1350 3361 V3233 Q1350 3206 1323 3206 Z" fill="#4ED0DB" fill-opacity="0.97" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M142 3223 h58" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="1320" cy="3223" r="5.6" fill="#36DDE8"/>
<text x="140" y="3274.04" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#18344A">Transformamos o estudo desse artefato complexo no propósito</text><text x="140" y="3315.29" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#18344A">da nossa existência e construímos ao seu redor uma estação</text><text x="140" y="3356.54" font-family="DejaVu Sans" font-weight="700" font-size="33" fill="#18344A">chamada “Os Últimos Portais”.</text></g>
<g id="CH06_P03_L007" data-speaker="CHR_038" data-kind="offscreen_neuron_speech" data-shape="nebula-speech-right" data-voice-mode="offscreen">
<path d="M1497 3194 Q1470 3194 1470 3221 V3362 Q1470 3389 1497 3389 H2214 L2293 3416 L2272 3389 H2343 Q2370 3389 2370 3362 V3221 Q2370 3194 2343 3194 Z" fill="#4ED0DB" fill-opacity="0.97" stroke="#253456" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M1502 3211 h58" stroke="#835FDB" stroke-width="3" stroke-linecap="round"/>
<circle cx="2340" cy="3211" r="5.6" fill="#36DDE8"/>
<text x="1500" y="3257.64" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#18344A">Há pouco tempo, chegou até nós um sinal estranho</text><text x="1500" y="3292.64" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#18344A">— o eco de acontecimentos terríveis que estavam</text><text x="1500" y="3327.64" font-family="DejaVu Sans" font-weight="700" font-size="28" fill="#18344A">ocorrendo em algum lugar muito distante.</text></g>
</svg>