<text x="118" y="170.0" fill="#2F294B" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700">Durante el viaje, el profesor decidió</text><text x="118" y="206.0" fill="#2F294B" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700">estudiar las muestras recogidas en Archeon.</text></g>
