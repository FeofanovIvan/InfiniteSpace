<text x="298" y="1641.0" fill="#3A2949" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700">¡Creo que ya sé de dónde</text><text x="298" y="1691.0" fill="#3A2949" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700">vienen!</text></g>
<g id="CH04_P04_L004" data-speaker="CHR_015" data-kind="science">
