<text x="1164" y="1615" fill="#FFAD56" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">PROFESSEUR · ANALYSE GÉNÉTIQUE</text><text x="1163" y="1675.6" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700">Leur ADN ressemble étonnamment à</text><text x="1163" y="1717.6" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700">celui d’anciens reptiles terrestres !</text></g>
<g id="CH04_P04_L005" data-speaker="CHR_015" data-kind="flashback">
<rect x="86" y="1846" width="1130" height="208" rx="25" fill="#1D1B37" opacity="0.17" />
<rect x="82" y="1840" width="1130" height="208" rx="25" fill="#FFF7E9" stroke="#BD84C5" stroke-width="6" />
<rect x="114" y="1858" width="92" height="9" rx="4.5" fill="#EEAD57" />
<text x="126" y="1889" fill="#965A42" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">LE PROFESSEUR EXPLIQUE</text><text x="125" y="1958.6" fill="#372B50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">Il y a 65 à 70 millions d’années, d’immenses créatures</text><text x="125" y="2000.6" fill="#372B50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">ressemblant à des lézards—les dinosaures—peuplaient la Terre.</text></g>
<g id="CH04_P04_L006" data-speaker="CHR_015" data-kind="dramatic">
<rect x="1484" y="2838" width="875" height="335" rx="25" fill="#1D1B37" opacity="0.17" />
<rect x="1480" y="2832" width="875" height="335" rx="25" fill="#FFF0D2" stroke="#DD9540" stroke-width="6" />
<rect x="1512" y="2850" width="92" height="9" rx="4.5" fill="#E77E36" />
<text x="1524" y="2881" fill="#965A42" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">PROFESSEUR · PASSÉ DE LA TERRE</text><text x="1523" y="2952.7" fill="#4C2C3B" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">Mais il y a environ 66 millions d’années, la chute</text><text x="1523" y="2993.7" fill="#4C2C3B" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">d’un gigantesque astéroïde a tout bouleversé.</text><text x="1523" y="3034.7" fill="#4C2C3B" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">La plupart des dinosaures ont disparu, ouvrant</text><text x="1523" y="3075.7" fill="#4C2C3B" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">de nouvelles voies à l’évolution des mammifères</text><text x="1523" y="3116.7" fill="#4C2C3B" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">puis, bien plus tard, des humains.</text></g>
