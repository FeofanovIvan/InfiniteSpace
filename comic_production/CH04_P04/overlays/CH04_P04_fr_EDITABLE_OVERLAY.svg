<text x="118" y="170.0" fill="#2F294B" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">Pendant le voyage, le professeur décida</text><text x="118" y="206.0" fill="#2F294B" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">d’étudier les échantillons recueillis sur Archéon.</text></g>
