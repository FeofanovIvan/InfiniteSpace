<text x="298" y="1641.0" fill="#3A2949" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700">Je crois savoir d’où ils</text><text x="298" y="1691.0" fill="#3A2949" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700">viennent !</text></g>
