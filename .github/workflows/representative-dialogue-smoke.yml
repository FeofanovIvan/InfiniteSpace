name: Representative dialogue scene smoke tests
on:
  push:
    branches:
      - feature/v93_1-representative-left-choices
  workflow_dispatch:

jobs:
  godot-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install current stable Godot 4 (Linux)
        run: |
          python3 - <<'PY'
          import json, urllib.request, zipfile, os
          req = urllib.request.Request(
              "https://api.github.com/repos/godotengine/godot/releases/latest",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "Mika-dialogue-tests"})
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          choices = [a for a in release.get("assets", [])
                     if a["name"].startswith("Godot_v4.") and a["name"].endswith("_linux.x86_64.zip")]
          if not choices:
              raise SystemExit("Godot Linux x86_64 asset not found on latest stable release")
          url = choices[0]["browser_download_url"]
          print("Installing", choices[0]["name"])
          urllib.request.urlretrieve(url, "godot.zip")
          with zipfile.ZipFile("godot.zip") as zip_file:
              zip_file.extractall("bin")
          binary = [os.path.join("bin", f) for f in os.listdir("bin") if f.startswith("Godot_")][0]
          os.chmod(binary, 0o755)
          os.rename(binary, "godot")
          PY
      - name: Import Godot project
        run: ./godot --headless --editor --path . --import --quit
      - name: Check world-dialogue content
        run: ./godot --headless --path . --script res://planet_hub/tests/dialogue_smoke.gd
      - name: Exercise actual dialogue scene layout and input
        run: ./godot --headless --path . --script res://planet_hub/tests/representative_dialog_ui_smoke.gd
