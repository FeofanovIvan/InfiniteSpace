name: Representative dialogue scene smoke tests
on:
  pull_request:
    branches:
      - feature/v99-four-chapter-dialogue-arcs
  workflow_dispatch:

jobs:
  godot-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.7.1 (Linux; pinned to game requirement)
        run: |
          python3 - <<'PY'
          import json, urllib.request, zipfile, os
          req = urllib.request.Request(
              "https://api.github.com/repos/godotengine/godot/releases/tags/4.7.1-stable",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "Mika-dialogue-tests"})
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          choices = [a for a in release.get("assets", [])
                     if a["name"] == "Godot_v4.7.1-stable_linux.x86_64.zip"]
          if not choices:
              raise SystemExit("Godot 4.7.1 stable Linux asset not found")
          url = choices[0]["browser_download_url"]
          print("Installing", choices[0]["name"])
          urllib.request.urlretrieve(url, "godot.zip")
          with zipfile.ZipFile("godot.zip") as zip_file:
              zip_file.extractall("bin")
          binary = [os.path.join("bin", f) for f in os.listdir("bin") if f.startswith("Godot_")][0]
          os.chmod(binary, 0o755)
          os.rename(binary, "godot")
          PY
      - name: Create isolated representative dialogue project
        run: |
          mkdir -p preview/planet_hub/{scripts,scenes,data,characters,tests} preview/scripts
          cp planet_hub/tests/standalone_project.godot preview/project.godot
          cp planet_hub/tests/PREVIEW_STANDALONE_RU.md preview/README_RU.md
          cp planet_hub/scenes/representative_dialog.tscn preview/planet_hub/scenes/
          cp planet_hub/scripts/{representative_dialog,dialog_character,dialog_hint,translator_tablet,dialogue_engine,child_profile_store,cloud_choice_button,dialogue_input_matcher}.gd preview/planet_hub/scripts/
          cp planet_hub/data/{dialogue_worlds,dialogue_phrases,dialogue_story_scenes,dialogue_story_quizzes,dialogue_adventures,dialogue_adventures_v99,representative_profiles,representatives}.json preview/planet_hub/data/
          cp planet_hub/tests/{representative_dialog_preview.gd,representative_dialog_preview.tscn,representative_dialog_ui_smoke.gd,dialogue_smoke.gd,dialogue_typing_tolerance_smoke.gd,dialogue_stories_smoke.gd,dialogue_adventures_smoke.gd,dialogue_chapters_v99_smoke.gd,dialogue_personas_smoke.gd} preview/planet_hub/tests/
          cp scripts/MobileLocale.gd preview/scripts/
          cp planet_hub/characters/{05_human_amara_cole,07_mold_form_archive,10_phase_crystal,01_reptile_liri,13_magnetic_ring,16_neural_historian}.png preview/planet_hub/characters/
          mkdir -p preview/planet_hub/backgrounds
          if test -f planet_hub/backgrounds/mw_p01.png; then
            cp planet_hub/backgrounds/mw_p01.png preview/planet_hub/backgrounds/
          fi
          (cd preview && zip -qr ../MIKA_dialogues_cumulative_v101.zip .)
      - name: Import isolated Godot preview
        run: ./godot --headless --editor --path preview --import --quit
      - name: Check world-dialogue content
        run: timeout 45s ./godot --headless --path preview --script res://planet_hub/tests/dialogue_smoke.gd
      - name: Exercise actual dialogue scene layout and input
        run: timeout 45s ./godot --headless --path preview --script res://planet_hub/tests/representative_dialog_ui_smoke.gd
      - name: Validate typo tolerance and intent safety
        run: timeout 45s ./godot --headless --path preview --script res://planet_hub/tests/dialogue_typing_tolerance_smoke.gd
      - name: Validate all six-race stories in every locale
        run: timeout 90s ./godot --headless --path preview --script res://planet_hub/tests/dialogue_stories_smoke.gd
      - name: Verify character memory and 72 multi-language adventures
        run: timeout 90s ./godot --headless --path preview --script res://planet_hub/tests/dialogue_adventures_smoke.gd
      - name: Check four chapters per race, six languages and v98 save migration
        run: timeout 90s ./godot --headless --path preview --script res://planet_hub/tests/dialogue_chapters_v99_smoke.gd
      - name: Validate world-bound characters and gender-neutral dialogue identity
        run: timeout 90s ./godot --headless --path preview --script res://planet_hub/tests/dialogue_personas_smoke.gd
      - name: Upload standalone scene project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIKA-dialogues-cumulative-v101
          path: MIKA_dialogues_cumulative_v101.zip
          retention-days: 14
